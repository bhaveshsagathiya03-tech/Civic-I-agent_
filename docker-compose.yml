services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: civic_i
      POSTGRES_USER: civic_i
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - civic_i_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civic_i -d civic_i"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: ./backend
      args:
        INSTALL_ML: ${INSTALL_ML:-0}
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: postgresql+psycopg://civic_i:${POSTGRES_PASSWORD}@db:5432/civic_i
      MEDIA_DIR: /data/media
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      YOLO_WEIGHTS: /models/civic_i_best.pt
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
    volumes:
      - civic_i_media:/data/media
      - ./backend/models:/models:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ""
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
volumes:
  civic_i_db:
  civic_i_media:
